            </div>
          )}

          {/* 4. CONSULTATION NOTES RECORDING MODAL */}
          {notesApt && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden border border-slate-100">
                <div className="bg-slate-900 p-6 text-white flex justify-between items-start">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-teal-400">Clinical Consultation</span>
                    <h3 className="text-lg font-bold text-white mt-1">Complete Visit &amp; Prescribe</h3>
                    <p className="text-xs text-slate-300">Patient: {notesApt.patientName} ({notesApt.patientAge}y, {notesApt.patientGender})</p>
                  </div>
                  <button onClick={() => setNotesApt(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const n = e.target.notes.value;
                    const p = e.target.pres.value;
                    handleSaveNotes(notesApt.id, n, p);
                  }}
                  className="p-6 space-y-4 text-xs"
                >
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-600 italic">
                    Reason: {notesApt.reason}
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Diagnosis &amp; Clinical Notes *</label>
                    <textarea
                      name="notes"
                      rows={3}
                      defaultValue={notesApt.consultationNotes}
                      required
                      placeholder="e.g. Acute bronchitis diagnosed. Vitals normal. Advised rest and fluids."
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Prescription Medications (Optional)</label>
                    <textarea
                      name="pres"
                      rows={3}
                      defaultValue={notesApt.prescription}
                      placeholder="1. Tab Amoxicillin 500mg TDS x 5 days&#10;2. Syp Ambroxol 10ml BD x 5 days"
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setNotesApt(null)} className="px-3 py-1.5 text-xs text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold text-white bg-teal-600 rounded-xl hover:bg-teal-700">
                      Save &amp; Mark Completed ✓
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 5. VIEW PRESCRIPTION MODAL */}
          {prescriptionViewApt && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-100">
                <div className="bg-gradient-to-r from-cyan-700 to-teal-700 p-6 text-white flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase text-cyan-200">Prescription Record</span>
                    <h3 className="text-lg font-bold text-white mt-1">{prescriptionViewApt.doctorName}</h3>
                    <p className="text-xs text-cyan-100">{prescriptionViewApt.specialty}</p>
                  </div>
                  <button onClick={() => setPrescriptionViewApt(null)} className="text-white">✕</button>
                </div>

                <div className="p-6 space-y-4 text-xs">
                  <div className="flex justify-between border-b pb-2 text-slate-500">
                    <span>Patient: <strong className="text-slate-800">{prescriptionViewApt.patientName}</strong></span>
                    <span>Date: <strong className="text-slate-800">{prescriptionViewApt.date}</strong></span>
                  </div>

                  <div>
                    <span className="font-bold text-slate-700 block mb-1 uppercase text-[10px]">Diagnosis:</span>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-800">
                      {prescriptionViewApt.consultationNotes || 'No notes recorded.'}
                    </div>
                  </div>

                  <div>
                    <span className="font-bold text-slate-700 block mb-1 uppercase text-[10px]">Medicines Prescribed:</span>
                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 font-mono text-slate-800 whitespace-pre-line">
                      {prescriptionViewApt.prescription || 'No medicines prescribed.'}
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-100 text-right">
                  <button onClick={() => setPrescriptionViewApt(null)} className="px-4 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <strong>MediConnect</strong> • Doctor &amp; Appointment Management System in React
              </div>
              <div className="flex items-center space-x-3">
                <button onClick={handleResetDemoData} className="text-rose-600 font-semibold hover:underline">
                  Reset Sample Data
                </button>
                <span>•</span>
                <span>Production-Ready React Platform</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 3. BOOKING MODAL DIALOG COMPONENT
    // ==========================================
    function BookingModalDialog({ doctor, onClose, onConfirm, appointments }) {
      const [step, setStep] = useState(1);
      const [mode, setMode] = useState(doctor.consultationModes[0] || 'In-Clinic');
      const [date, setDate] = useState(getTodayDateStr());
      const [slot, setSlot] = useState('');

      const [patientName, setPatientName] = useState('');
      const [patientPhone, setPatientPhone] = useState('');
      const [patientEmail, setPatientEmail] = useState('');
      const [patientAge, setPatientAge] = useState('');
      const [patientGender, setPatientGender] = useState('Male');
      const [reason, setReason] = useState('');

      const slots = [
        '09:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '12:00 PM',
        '01:00 PM', '01:30 PM', '02:00 PM',
        '05:00 PM', '05:30 PM', '06:00 PM', '06:30 PM', '07:00 PM', '07:30 PM', '08:00 PM'
      ];

      const isBooked = (s) => {
        return appointments.some(a => a.doctorId === doctor.id && a.date === date && a.timeSlot === s && a.status !== 'Cancelled');
      };

      const handleNext = () => {
        if (step === 1) {
          if (!slot) {
            alert('Please select an available time slot.');
            return;
          }
          setStep(2);
        } else if (step === 2) {
          if (!patientName.trim() || !patientPhone.trim() || !patientEmail.trim() || !patientAge || !reason.trim()) {
            alert('Please fill out all required fields.');
            return;
          }
          onConfirm({
            doctorId: doctor.id,
            doctorName: doctor.name,
            specialty: doctor.specialty,
            fee: doctor.consultationFee,
            date,
            timeSlot: slot,
            mode,
            patientName,
            patientPhone,
            patientEmail,
            patientAge: Number(patientAge),
            patientGender,
            reason
          });
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-xl w-full shadow-2xl overflow-hidden border border-slate-100">
            {/* Header */}
            <div className="bg-gradient-to-r from-slate-900 to-cyan-950 p-6 text-white flex justify-between items-start">
              <div>
                <span className="text-[10px] uppercase font-bold text-cyan-300">Book Appointment</span>
                <h3 className="text-lg font-bold text-white mt-1">{doctor.name}</h3>
                <p className="text-xs text-slate-300">{doctor.specialty} • ₹{doctor.consultationFee}</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            {/* Content */}
            <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto text-xs">
              {step === 1 ? (
                <div className="space-y-4">
                  {/* Mode */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5 uppercase text-[10px]">Consultation Mode</label>
                    <div className="grid grid-cols-2 gap-2">
                      {doctor.consultationModes.map(m => (
                        <button
                          key={m}
                          type="button"
                          onClick={() => setMode(m)}
                          className={`p-3 rounded-xl border text-left font-bold transition-all ${
                            mode === m ? 'border-cyan-600 bg-cyan-50 text-cyan-900' : 'border-slate-200 bg-slate-50 text-slate-600'
                          }`}
                        >
                          {m === 'In-Clinic' ? '🏥 In-Clinic' : '💻 Video Call'}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Date */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5 uppercase text-[10px]">Select Date</label>
                    <input
                      type="date"
                      value={date}
                      min={getTodayDateStr()}
                      onChange={(e) => { setDate(e.target.value); setSlot(''); }}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold"
                    />
                  </div>

                  {/* Slots */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5 uppercase text-[10px]">Select Time Slot</label>
                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                      {slots.map(s => {
                        const booked = isBooked(s);
                        const isSel = slot === s;
                        return (
                          <button
                            key={s}
                            type="button"
                            disabled={booked}
                            onClick={() => setSlot(s)}
                            className={`p-2 rounded-lg text-center font-semibold transition-all ${
                              booked ? 'bg-slate-200 text-slate-400 cursor-not-allowed line-through' :
                              isSel ? 'bg-cyan-600 text-white font-bold shadow-xs' :
                              'bg-slate-50 hover:bg-cyan-50 border border-slate-200 text-slate-700'
                            }`}
                          >
                            {s}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="space-y-3">
                  <div className="bg-cyan-50 p-3 rounded-xl border border-cyan-200 font-bold text-cyan-900">
                    Slot: {date} at {slot} ({mode})
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Patient Full Name *</label>
                      <input
                        type="text"
                        value={patientName}
                        onChange={(e) => setPatientName(e.target.value)}
                        placeholder="e.g. Rahul Sharma"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Phone Number *</label>
                      <input
                        type="tel"
                        value={patientPhone}
                        onChange={(e) => setPatientPhone(e.target.value)}
                        placeholder="e.g. +91 98765 43210"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="block font-bold text-slate-700 mb-1">Email Address *</label>
                      <input
                        type="email"
                        value={patientEmail}
                        onChange={(e) => setPatientEmail(e.target.value)}
                        placeholder="e.g. patient@gmail.com"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Age *</label>
                      <input
                        type="number"
                        value={patientAge}
                        onChange={(e) => setPatientAge(e.target.value)}
                        placeholder="32"
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Gender</label>
                    <div className="flex space-x-3">
                      {['Male', 'Female', 'Other'].map(g => (
                        <label key={g} className="flex items-center space-x-1 cursor-pointer">
                          <input
                            type="radio"
                            name="gender"
                            value={g}
                            checked={patientGender === g}
                            onChange={(e) => setPatientGender(e.target.value)}
                          />
                          <span>{g}</span>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Primary Symptoms / Reason for Visit *</label>
                    <textarea
                      rows={3}
                      value={reason}
                      onChange={(e) => setReason(e.target.value)}
                      placeholder="Briefly state your symptoms, existing medical history, or consultation goals..."
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                    ></textarea>
                  </div>
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs">
              <span className="font-bold text-slate-900">Total Fee: ₹{doctor.consultationFee}</span>
              <div className="flex space-x-2">
                {step === 2 && (
                  <button onClick={() => setStep(1)} className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl font-semibold">
                    Back
                  </button>
                )}
                <button
                  onClick={handleNext}
                  className="px-5 py-2 bg-gradient-to-r from-cyan-600 to-teal-600 text-white rounded-xl font-bold shadow-xs hover:from-cyan-700 hover:to-teal-700"
                >
                  {step === 1 ? 'Next: Patient Details →' : 'Confirm & Book Slot ✓'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
